<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لُعْبَة السَّفَر</title>
    <style>
    @font-face {
        font-family: 'AraKom';
        src: url('arakom.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --primary: #3498db;
        --success: #2ecc71;
        --error: #e74c3c;
        --bg: #ecf0f1;
    }

   body {
    font-family: 'AraKom', Arial, sans-serif;
    background-color: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

    .game-card {
    position: relative;
    background: white;
    padding: 0.5rem;
    /* Genişlik ve yüksekliği tüm ekrana yayıyoruz */
    width: 100vw; 
    height: 100vh;
    /* Köşe ovalini kaldırıyoruz çünkü artık tam ekran */
    border-radius: 0; 
    box-shadow: none;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center; /* İçerikleri dikeyde ortalar */
    box-sizing: border-box;
}

/* Picker konteynırını da genişletelim ki ekranı doldursun */
.pickers-container {
    display: flex;
    gap: 10px;
    height: 45vh; /* Ekran yüksekliğinin yarısı kadar yapalım */
    margin-bottom: 0.5rem;
    position: relative;
    background: #f1f1f1;
    border-radius: 20px;
    padding: 10px;
    width: 50%; /* Kenarlardan çok az pay bırakır */
    margin-left: auto;
    margin-right: auto;
}

    /* Giriş Ekranı Tasarımı */
    #startScreen h1 {
        font-size: 4.5rem;
        color: var(--primary);
        margin-bottom: 1rem;
        text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
    }

    .instructions {
    font-size: 2.5rem;
    font-weight: bold;
    text-align: center;
    direction: rtl;
    margin-bottom: 10px; /* Alttan 10px boşluk */
}

    .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        color: var(--primary);
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: 0.3s;
        z-index: 100;
        border: 1px solid #eee;
        text-decoration: none;
    }

    .back-button:hover {
        background: var(--primary);
        color: white;
    }

    .progress-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
    }

    .progress-step {
        width: 80px;
        height: 15px;
        background: #ddd;
        border-radius: 10px;
        transition: 0.3s;
    }

    .sentence-box {
        background: #f8f9fa;
        padding: 1rem;
        border-radius: 20px;
        font-size: 5rem;
        margin-bottom: 0.5rem;
        border: 3px solid #eee;
        color: #2c3e50;
    }

    

    .selection-overlay {
        position: absolute;
        top: 50%;
        left: 10px;
        right: 10px;
        height: 120px;
        transform: translateY(-50%);
        border: 6px solid var(--primary);
        border-radius: 20px;
        background: rgba(52, 152, 219, 0.1);
        pointer-events: none;
        z-index: 10;
    }

    .picker-column {
        flex: 1;
        overflow-y: scroll;
        overflow-x: hidden;
        scroll-snap-type: y mandatory;
        height: 100%;
        scrollbar-width: none;
        position: relative;
        border-radius: 15px;
        background: white;
        transition: 0.3s;
        display: flex;
        flex-direction: column;
        -webkit-overflow-scrolling: touch;
    }

    .picker-column::-webkit-scrollbar { display: none; }

    @keyframes spinDown {
        0% { transform: translateY(0); }
        100% { transform: translateY(-400px); }
    }

    @keyframes spinUp {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(0); }
    }

    .picker-item {
        height: 120px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        font-size: 4.5rem;
        opacity: 0.3;
        transition: 0.3s;
        flex-shrink: 0;

    }

    .picker-item.active { 
        opacity: 1; 
        transform: scale(1.2); 
    }

    .correct { background-color: rgba(46, 204, 113, 0.3) !important; border: 2px solid var(--success); }
    .wrong { background-color: rgba(231, 76, 60, 0.3) !important; animation: shake 0.4s; }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }

   button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 20px 70px; /* Yatay boşluğu buradan kontrol edebilirsin */
    border-radius: 50px;
    font-size: 3rem;
    cursor: pointer;
    font-family: 'AraKom', sans-serif;
    box-shadow: 0 4px 0 #2980b9;
    
    /* EKLEMEN GEREKENLER */
    align-self: center; /* Butonu merkeze alır ve genişlemesini engeller */
    width: fit-content; /* Sadece metin kadar genişlemesini sağlar */
}

    button:active {
        transform: translateY(4px);
        box-shadow: none;
    }

    .hidden { display: none; }

     /* "Sonraki Soru" butonu için özel vurgu */
#nextBtn {
    background: var(--success); /* Yeşil renk */
    box-shadow: 0 6px 0 #27ae60;
    animation: pulse-green 1.5s infinite; /* Sürekli büyüme/küçülme efekti */
}

#nextBtn:hover {
    background: #27ae60;
    transform: scale(1.05);
}

/* Dikkat çekici nabız animasyonu */
@keyframes pulse-green {
    0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
    }
    70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 20px rgba(46, 204, 113, 0);
    }
    100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
    }
}
/* Vurgulu kelime stili */
.highlight {
    color: var(--primary);
    text-decoration: underline;
    font-weight: bold;
    font-size: 1.2em;
    transition: all 0.3s ease;
}

/* Kilitli picker sütunu */
.picker-column.locked {
    pointer-events: none;
    opacity: 0.2;
    filter: grayscale(1);
}

/* Aktif picker sütunu */
.picker-column.active-stage {
    pointer-events: auto;
    opacity: 1;
    filter: none;
    border: 3px solid var(--primary);
}

/* --- Renk Animasyonları Tanımları --- */
@keyframes pulse-red { 0%, 100% { color: #e74c3c; } 50% { color: #ff7675; } }
@keyframes pulse-blue { 0%, 100% { color: #3498db; } 50% { color: #74b9ff; } }
@keyframes pulse-green { 0%, 100% { color: #2ecc71; } 50% { color: #55efc4; } }

/* --- Kelime Sınıfları --- */
.flash-red { 
    animation: pulse-red 1.5s infinite ease-in-out; 
    display: inline; 
    font-weight: normal;
}

.flash-blue { 
    animation: pulse-blue 1.5s infinite ease-in-out; 
    display: inline; 
    font-weight: normal;
}

.flash-green { 
    animation: pulse-green 1.5s infinite ease-in-out; 
    display: inline; 
    font-weight: normal;
}

/* --- Sabit Kelimeler (Fiil, Harfi Cerler ve Nokta) --- */
.static-word {
    display: inline;
    color: #7f8c8d; /* Dikkat dağıtmaması için hafif gri */
}

/* --- Genel Cümle Kutusu Düzenlemesi (Opsiyonel) --- */
.sentence-box {
    direction: rtl;
    unicode-bidi: isolate; /* Arapça karakterlerin ve noktanın doğru hizalanması için */
}


.sentence-box {
    line-height: 1.6;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

/* --- Boşluk Kontrolü Yaması --- */
.sentence-box {
    gap: 0 !important; /* Otomatik boşlukları tamamen kapat */
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}

/* Tüm kelimelere standart sağ boşluk ver (RTL olduğu için sol taraf boşluk olur) */
.flash-red, .flash-blue, .flash-green, .static-word {
    display: inline-block;
    margin-left: 25px; /* Kelimeler arası boşluk */
    vertical-align: middle;
}

/* Araç kelimesi ve Nokta için özel yapıştırma kuralları */
.no-margin {
    margin-left: 0 !important;
    margin-right: 0 !important;
}

.home-button {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    color: var(--primary);
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
    text-decoration: none;
    border: 1px solid #eee;
}

.home-button:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-2px);
}

/* Giriş ekranındaki butonun yayılmasını engellemek için (önceki konuşmamızdaki düzeltme) */
#startScreen button {
    align-self: center;
    width: fit-content;
    min-width: 150px;
}
</style>

<audio id="soundGuide" src="yonergeseyahat.mp3"></audio>

<script>
    let currentQuestion = 0;
    let questions = [];

     // Web Audio API için ses bağlamı oluştur
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(type) {
    // Tarayıcı kısıtlamalarını aşmak için ses bağlamını uyandır
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.type = 'sine'; // Sinüs dalgası
    const now = audioCtx.currentTime;
    
    if (type === 'correct') {
        // Doğru Sesi: 440Hz'den 880Hz'e doğru neşeli ve hızlı bir artış
        oscillator.frequency.setValueAtTime(440, now);
        oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        
        // Ses patlamasını (click) önlemek için yumuşak azalış
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.5, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        
        oscillator.start(now);
        oscillator.stop(now + 0.3);
    } else {
        // Yanlış Sesi: 300Hz'den 150Hz'e doğru üzgün bir düşüş
        oscillator.frequency.setValueAtTime(300, now);
        oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.2);
        
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.5, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        
        oscillator.start(now);
        oscillator.stop(now + 0.4);
    }
}

    // 1. Veri setindeki noktaları temizliyoruz (daha temiz bir birleştirme için)
const presetSentences = [
    { p: "أَبي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى البَحْر", t: "بِالسَّيّارَة", g: "m" },
    { p: "أُمّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الكَعْبَة", t: "بِالطّائِرَة", g: "f" },
    { p: "أَخي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الحَديقَة", t: "بِالدَّرّاجَة", g: "m" },
    { p: "أُخْتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى المَكْتَبَة", t: "بِالسَّيّارَة", g: "f" },
    { p: "جَدّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الجَبَل", t: "بِالدَّرّاجَة", g: "m" },
    { p: "جَدَّتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى السّوق", t: "بِالسَّيّارَة", g: "f" },
    { p: "أَبي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى إِسْطَنْبول", t: "بِالطّائِرَة", g: "m" },
    { p: "أَخي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى البَحْر", t: "بِالسَّيّارَة", g: "m" },
    { p: "أُخْتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الحَديقَة", t: "بِالحافِلَة", g: "f" },
    { p: "أُمّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى المَكْتَبَة", t: "بِالدَّرّاجَة", g: "f" }
];

   const data = {
    persons: [{ar: "أَبي", emoji: "👨"}, {ar: "أُمّي", emoji: "👩"}, {ar: "أَخي", emoji: "👦"}, {ar: "أُخْتي", emoji: "👧"}, {ar: "جَدّي", emoji: "👴"}, {ar: "جَدَّتي", emoji: "👵"}],
    places: [{ar: "إِلى البَحْر", emoji: "🌊"}, {ar: "إِلى الكَعْبَة", emoji: "🕋"}, {ar: "إِلى السّوق", emoji: "🛍️"}, {ar: "إِلى الحَديقَة", emoji: "🌳"}, {ar: "إِلى الجَبَل", emoji: "⛰️"}, {ar: "إِلى المَكْتَبَة", emoji: "📚"}, {ar: "إِلى إِسْطَنْبول", emoji: "🌉"}],
    transports: [
        {ar: "بِالطّائِرَة", emoji: "✈️"}, 
        {ar: "بِالسَّيّارَة", emoji: "🚗"}, 
        {ar: "بِالحافِلَة", emoji: "🚌"}, 
        {ar: "بِالسَّفينَة", emoji: "🚢"}, 
        {ar: "بِالدَّرّاجَة", emoji: "🚲"}, 
        {ar: "بِالمَتْرو", emoji: "🚊"}
    ] // Sonundaki noktalar kaldırıldı
};

    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        
        // Yönerge sesini çal
        const guideAudio = document.getElementById('soundGuide');
        guideAudio.play().catch(e => console.log("Ses çalınamadı (Etkileşim gerekiyor)"));
        
        initPickers();
        generateRound();
        spinPickers();
    }

    function initPickers() {
        fillColumn('person-picker', data.persons);
        fillColumn('place-picker', data.places);
        fillColumn('transport-picker', data.transports);
        
        document.querySelectorAll('.picker-column').forEach(col => {
            col.addEventListener('scroll', () => {
                const itemHeight = 120;
                const totalItems = col.querySelectorAll('.picker-item').length;
                const originalCount = totalItems - 6;

                if (col.scrollTop >= (originalCount + 3) * itemHeight) {
                    col.scrollTop = 3 * itemHeight;
                }
                if (col.scrollTop <= 0) {
                    col.scrollTop = originalCount * itemHeight;
                }
                updateActiveItem(col);
            });
        });
    }

    function fillColumn(id, items) {
        const col = document.getElementById(id);
        const clonesBefore = items.slice(-3);
        const clonesAfter = items.slice(0, 3);
        const combined = [...clonesBefore, ...items, ...clonesAfter];

        col.innerHTML = combined.map(item => 
            `<div class="picker-item" data-val="${item.ar}">${item.emoji}</div>`
        ).join('');
        setTimeout(() => { col.scrollTop = 120 * 3; }, 10);
    }

    function spinPickers() {
    // Çark sesini başlat
    const spinAudio = document.getElementById('soundSpin');
    spinAudio.currentTime = 0; // Sesi başa sar
    spinAudio.play().catch(() => {}); // Kullanıcı etkileşimi yoksa hata vermesini engelle

    let maxDuration = 0; // En uzun dönme süresini bulmak için

    document.querySelectorAll('.picker-column').forEach((col, index) => {
        col.style.scrollSnapType = 'none';
        col.style.overflowY = 'hidden';
        
        const duration = 2 + Math.random();
        if (duration > maxDuration) {
            maxDuration = duration; // En geç duracak sütunun süresini kaydet
        }

        const items = col.querySelectorAll('.picker-item');
        const animationName = index === 1 ? 'spinUp' : 'spinDown';

        items.forEach(item => {
            item.style.animation = `${animationName} ${duration}s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards`;
        });
        
        setTimeout(() => { stopAndRelease(col); }, duration * 1000);
    });

    // En son çark durduğunda sesi de durdur
    setTimeout(() => {
        spinAudio.pause();
        spinAudio.currentTime = 0;
    }, maxDuration * 1000);
}

    function stopAndRelease(col) {
        if (col.style.overflowY === 'scroll') return;
        const itemHeight = 120;
        const items = col.querySelectorAll('.picker-item');
        items.forEach(item => item.style.animation = 'none');
        const randomIndex = Math.floor(Math.random() * (items.length - 6)) + 3;
        col.style.overflowY = 'scroll';
        col.scrollTop = randomIndex * itemHeight;
        col.style.scrollSnapType = 'y mandatory';
        updateActiveItem(col);
    }

    function updateActiveItem(col) {
        const items = col.querySelectorAll('.picker-item');
        let closest = null;
        let minDistance = Infinity;
        const containerCenter = col.getBoundingClientRect().top + col.getBoundingClientRect().height / 2;

        items.forEach(item => {
            const rect = item.getBoundingClientRect();
            const center = rect.top + rect.height / 2;
            const distance = Math.abs(center - containerCenter);
            if (distance < minDistance) {
                minDistance = distance;
                closest = item;
            }
            item.classList.remove('active');
        });
        if (closest) closest.classList.add('active');
    }

    function generateRound() {
    const shuffled = [...presetSentences].sort(() => 0.5 - Math.random());
    questions = shuffled.slice(0, 3).map(item => {
        const verb = item.g === 'm' ? item.v_m : item.v_f;
        // Temizlik: Gelen veride nokta varsa siliyoruz
        const transportClean = item.t.replace(/\./g, '').trim();
        
        return {
            // Ekranda görünen: "يَذْهَبُ أَبي إِلى البَحْر بِالسَّيّارَة."
            sentence: `${verb} ${item.p} ${item.l} ${transportClean}.`, 
            // Kontrol için saklanan saf kelimeler
            p: item.p.trim(), 
            l: item.l.trim(), 
            t: transportClean
        };
    });
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestion];
    const targetBox = document.getElementById('targetSentence');
    
    // Fiili al
    const verb = q.sentence.split(' ')[0];
    
    // Mekan kısmından "إِلى" temizle
    let cleanPlace = q.l.replace(/^إِلى\s+/, '').trim();

    // HTML Dizilimi: 
    // flash-green kelimesine 'no-margin' verdik ki noktaya yaklaşsın.
    // Noktaya da 'no-margin' verdik ki arada boşluk kalmasın.
    targetBox.innerHTML = `
        <span class="static-word">${verb}</span>
        <span class="flash-red">${q.p}</span>
        <span class="static-word">إِلى</span>
        <span class="flash-blue">${cleanPlace}</span>
        <span class="flash-green no-margin">${q.t}</span><span class="static-word no-margin">.</span>
    `;
    
    resetUI();
}

    function resetUI() {
        document.querySelectorAll('.picker-column').forEach(c => c.classList.remove('correct', 'wrong'));
        document.getElementById('checkBtn').classList.remove('hidden');
        document.getElementById('nextBtn').classList.add('hidden');
    }

function checkAnswer() {
    const q = questions[currentQuestion];
    
    const selP = document.querySelector('#person-picker .picker-item.active')?.getAttribute('data-val');
    const selL = document.querySelector('#place-picker .picker-item.active')?.getAttribute('data-val');
    const selT = document.querySelector('#transport-picker .picker-item.active')?.getAttribute('data-val');

    // Her şeyi temizleyen fonksiyon (Noktalar ve boşluklar gider)
    const clean = (str) => str ? str.replace(/\./g, '').trim() : "";

    const isP = clean(selP) === clean(q.p);
    const isL = clean(selL) === clean(q.l);
    const isT = clean(selT) === clean(q.t);

    // Görsel geri bildirim
    const pCol = document.getElementById('person-picker');
    const lCol = document.getElementById('place-picker');
    const tCol = document.getElementById('transport-picker');

    pCol.classList.remove('correct', 'wrong');
    lCol.classList.remove('correct', 'wrong');
    tCol.classList.remove('correct', 'wrong');

    // CSS sınıflarını ekle (Hangi sütun yanlışsa o kırmızı yanar)
    pCol.classList.add(isP ? 'correct' : 'wrong');
    lCol.classList.add(isL ? 'correct' : 'wrong');
    tCol.classList.add(isT ? 'correct' : 'wrong');

    const step = document.querySelectorAll('.progress-step')[currentQuestion];
    
    if (isP && isL && isT) {
        // Sinüs dalgası ile doğru sesi çal
        playTone('correct');
        
        step.style.background = 'var(--success)';
        document.getElementById('checkBtn').classList.add('hidden');
        document.getElementById('nextBtn').classList.remove('hidden');
    } else {
        // Sinüs dalgası ile yanlış sesi çal
        playTone('wrong');
        
        step.style.background = 'var(--error)';
    }
}

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < 3) {
            showQuestion();
            spinPickers();
        } else {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('nextStudentScreen').classList.remove('hidden');
        }
    }

    function resetGame() {
        currentQuestion = 0;
        document.querySelectorAll('.progress-step').forEach(s => s.style.background = '#ddd');
        document.getElementById('nextStudentScreen').classList.add('hidden');
        startGame(); // startGame çağrıldığında yönerge sesi tekrar çalacaktır
    }
</script>
</body>
</html>
