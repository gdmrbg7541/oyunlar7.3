<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة السفر العربية</title>
    <style>
    @font-face {
        font-family: 'AraKom';
        src: url('arakom.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --primary: #3498db;
        --success: #2ecc71;
        --error: #e74c3c;
        --bg: #ecf0f1;
    }

    body {
        font-family: 'AraKom', Arial, sans-serif;
        background-color: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .game-card {
        position: relative;
        background: white;
        padding: 3rem;
        border-radius: 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        width: 800px;
        text-align: center;
    }

    .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        color: var(--primary);
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
        border: 1px solid #eee;
        text-decoration: none;
    }

    .back-button:hover {
        transform: translateX(-5px);
        background: var(--primary);
        color: white;
    }

    .progress-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
    }

    .progress-step {
        width: 80px;
        height: 15px;
        background: #ddd;
        border-radius: 10px;
        transition: 0.3s;
    }

    .sentence-box {
        background: #f8f9fa;
        padding: 2rem;
        border-radius: 20px;
        font-size: 2.5rem;
        margin-bottom: 2rem;
        border: 3px solid #eee;
        color: #2c3e50;
    }

    .pickers-container {
        display: flex;
        gap: 20px;
        height: 350px;
        margin-bottom: 2rem;
        position: relative;
        background: #f1f1f1;
        border-radius: 20px;
        padding: 10px;
    }

    .selection-overlay {
        position: absolute;
        top: 50%;
        left: 10px;
        right: 10px;
        height: 120px;
        transform: translateY(-50%);
        border: 6px solid var(--primary);
        border-radius: 20px;
        background: rgba(52, 152, 219, 0.1);
        pointer-events: none;
        z-index: 10;

    }

    .picker-column {
    flex: 1;
    overflow-y: scroll;
    overflow-x: hidden; /* Yatay kaymayı engelle */
    scroll-snap-type: y mandatory;
    height: 100%;
    scrollbar-width: none;
    position: relative;
    border-radius: 15px;
    background: white;
    /* transition'ı sadece transform için kullanın, tüm özellikleri etkilemesin */
    transition: transform 0.5s ease; 
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch; /* Mobil akıcılığı için */
}

    .picker-column::-webkit-scrollbar { display: none; }

    /* Animasyonlar */
    @keyframes spinDown {
        0% { transform: translateY(0); }
        100% { transform: translateY(-600px); }
    }

    @keyframes spinUp {
        0% { transform: translateY(-600px); }
        100% { transform: translateY(0); }
    }

    .picker-item {
        height: 120px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        font-size: 5rem;
        opacity: 0.3;
        transition: 0.3s;
        flex-shrink: 0;
       pointer-events: auto; /* Tıklanabilir olduğundan emin olun */
        backface-visibility: hidden; /* Animasyon akıcılığı için */
    }

    .picker-item.active { 
        opacity: 1; 
        transform: scale(1.2); 
    }

    .correct { background-color: rgba(46, 204, 113, 0.3) !important; border: 2px solid var(--success); }
    .wrong { background-color: rgba(231, 76, 60, 0.3) !important; animation: shake 0.4s; }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }

    button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 15px 50px;
        border-radius: 50px;
        font-size: 1.8rem;
        cursor: pointer;
        font-family: 'AraKom', sans-serif;
    }

    .hidden { display: none; }
</style>
</head>
<body>

<div class="game-card" id="gameScreen">
    <a href="index.html" class="back-button">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>
    <div class="progress-container" id="progressBar">
        <div class="progress-step"></div>
        <div class="progress-step"></div>
        <div class="progress-step"></div>
    </div>
    
    <div class="sentence-box" id="targetSentence">جاري التحميل...</div>

    <div class="pickers-container">
         <div class="picker-column" id="person-picker"></div>
         <div class="selection-overlay"></div>
         <div class="picker-column" id="place-picker"></div>
         <div class="picker-column" id="transport-picker"></div>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">تَأْكيد</button>
        <button id="nextBtn" class="hidden" onclick="nextQuestion()">السُّؤال التّالي</button>
    </div>
</div>

<div class="game-card hidden" id="nextStudentScreen">
    <h2 style="font-size: 3rem; color: var(--success);">أَحْسَنْت! 🎉</h2>
    <p style="font-size: 1.5rem;">لَقَد أَكْمَلْت جَميع الأَسْئِلَة.</p>
    <button onclick="resetGame()">تَغْيير الطالب</button>
</div>

<audio id="soundCorrect" src="https://freesound.org/data/previews/270/270402_5123851-lq.mp3" crossorigin="anonymous"></audio>
<audio id="soundWrong" src="https://freesound.org/data/previews/415/415764_6081716-lq.mp3" crossorigin="anonymous"></audio>

<script>
    let currentQuestion = 0;
    let questions = [];

    // Mantıklı senaryolardan oluşan 15 hazır cümle
    const presetSentences = [
        { p: "أَبي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى البَحْر", t: "بِالسَّيّارَة.", g: "m" },
        { p: "أُمّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الكَعْبَة", t: "بِالطّائِرَة.", g: "f" },
        { p: "أَخي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الحَديقَة", t: "بِالدَّرّاجَة.", g: "m" },
        { p: "أُخْتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى المَكْتَبَة", t: "بِالسَّيّارَة.", g: "f" },
        { p: "جَدّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الجَبَل", t: "بِالدَّرّاجَة.", g: "m" },
        { p: "جَدَّتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى السّوق", t: "بِالسَّيّارَة.", g: "f" },
        { p: "أَبي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى إِسْطَنْبول", t: "بِالطّائِرَة.", g: "m" },
        { p: "أَخي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى البَحْر", t: "بِالسَّيّارَة.", g: "m" },
        { p: "أُخْتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الحَديقَة", t: "بِالحافِلَة.", g: "f" },
        { p: "أُمّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى المَكْتَبَة", t: "بِالدَّرّاجَة.", g: "f" },
        { p: "جَدّي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى السّوق", t: "بِالحافِلَة.", g: "m" },
        { p: "أَخي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الجَبَل", t: "بِالدَّرّاجَة.", g: "m" },
        { p: "أَبي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى الكَعْبَة", t: "بِالسَّفينَة.", g: "m" },
        { p: "جَدَّتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى إِسْطَنْبول", t: "بِالحافِلَة.", g: "f" },
        { p: "أُخْتي", v_m: "يَذْهَبُ", v_f: "تَذْهَبُ", l: "إِلى البَحْر", t: "بِالمَتْرو.", g: "f" }
    ];

    const data = {
        persons: [
            {ar: "أَبي", emoji: "👨"}, {ar: "أُمّي", emoji: "👩"},
            {ar: "أَخي", emoji: "👦"}, {ar: "أُخْتي", emoji: "👧"},
            {ar: "جَدّي", emoji: "👴"}, {ar: "جَدَّتي", emoji: "👵"}
        ],
        places: [
            {ar: "إِلى البَحْر", emoji: "🌊"}, {ar: "إِلى الكَعْبَة", emoji: "🕋"},
            {ar: "إِلى السّوق", emoji: "🛍️"}, {ar: "إِلى الحَديقَة", emoji: "🌳"},
            {ar: "إِلى الجَبَل", emoji: "⛰️"}, {ar: "إِلى المَكْتَبَة", emoji: "📚"},
            {ar: "إِلى إِسْطَنْبول", emoji: "🌉"}
        ],
        transports: [
            {ar: "بِالطّائِرَة.", emoji: "✈️"}, {ar: "بِالسَّيّارَة.", emoji: "🚗"},
            {ar: "بِالحافِلَة.", emoji: "🚌"}, {ar: "بِالسَّفينَة.", emoji: "🚢"},
            {ar: "بِالدَّرّاجَة.", emoji: "🚲"}, {ar: "بِالمَتْرو.", emoji: "🚊"},
        ]
    };

    function initPickers() {
        fillColumn('person-picker', data.persons);
        fillColumn('place-picker', data.places);
        fillColumn('transport-picker', data.transports);
        
        document.querySelectorAll('.picker-column').forEach(col => {
            col.addEventListener('scroll', () => {
                const itemHeight = 120;
                const totalItems = col.querySelectorAll('.picker-item').length;
                const originalCount = totalItems - 6;

                if (col.scrollTop >= (originalCount + 3) * itemHeight) {
                    col.scrollTop = 3 * itemHeight;
                }
                if (col.scrollTop <= 0) {
                    col.scrollTop = originalCount * itemHeight;
                }
                updateActiveItem(col);
            });
        });
    }

    function fillColumn(id, items) {
        const col = document.getElementById(id);
        const clonesBefore = items.slice(-3);
        const clonesAfter = items.slice(0, 3);
        const combined = [...clonesBefore, ...items, ...clonesAfter];

        col.innerHTML = combined.map(item => 
            `<div class="picker-item" data-val="${item.ar}">${item.emoji}</div>`
        ).join('');

        setTimeout(() => { col.scrollTop = 120 * 3; }, 10);
    }

function spinPickers() {
    const columns = document.querySelectorAll('.picker-column');
    columns.forEach((col, index) => {
        col.style.scrollSnapType = 'none';
        col.style.overflowY = 'hidden';
        
        // Rastgele süre ekleyerek (opsiyonel) çarkların farklı zamanlarda durmasını sağlayabilirsin
        const duration = 2 + Math.random(); // 2 ile 3 saniye arası
        
        const items = col.querySelectorAll('.picker-item');
        const isMiddle = index === 1;
        const animationName = isMiddle ? 'spinUp' : 'spinDown';

        items.forEach(item => {
            // Süreyi dinamik yaptık (2.5s yerine 'duration' değişkeni)
            item.style.animation = `${animationName} ${duration}s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards`;
        });

        // Animasyon bitince durdur ve rastgele bir öğeye odakla
        setTimeout(() => { stopAndRelease(col); }, duration * 1000);
        
        const releaseAction = () => stopAndRelease(col);
        col.addEventListener('touchstart', releaseAction, {once: true});
        col.addEventListener('mousedown', releaseAction, {once: true});
    });
}

function stopAndRelease(col) {
    // Eğer zaten durmuşsa tekrar çalıştırma
    if (col.style.overflowY === 'scroll') return;

    const itemHeight = 120;
    const items = col.querySelectorAll('.picker-item');
    
    // 1. Animasyonları temizle ama transform'u sıfırlama (görsel atlamayı önlemek için)
    items.forEach(item => {
        item.style.animation = 'none';
    });

    // 2. MANTIK: Rastgele bir öğe seç (Klonlar hariç gerçek öğeler: index 3 ile total-3 arası)
    const totalItems = items.length;
    const realItemsCount = totalItems - 6; 
    const randomIndex = Math.floor(Math.random() * realItemsCount) + 3;

    // 3. Çarkı rastgele seçilen öğeye "ışınla"
    col.style.overflowY = 'scroll';
    col.scrollTop = randomIndex * itemHeight;

    // 4. Hizalamayı (Snap) geri getir ki en yakın emojiyi otomatik ortalasın
    col.style.scrollSnapType = 'y mandatory';
    
    // 5. Hangi öğenin aktif olduğunu güncelle
    updateActiveItem(col);
}

    function updateActiveItem(col) {
        const items = col.querySelectorAll('.picker-item');
        let closest = null;
        let minDistance = Infinity;
        const containerCenter = col.getBoundingClientRect().top + col.getBoundingClientRect().height / 2;

        items.forEach(item => {
            const rect = item.getBoundingClientRect();
            const center = rect.top + rect.height / 2;
            const distance = Math.abs(center - containerCenter);
            if (distance < minDistance) {
                minDistance = distance;
                closest = item;
            }
            item.classList.remove('active');
        });
        if (closest) closest.classList.add('active');
    }

    function generateRound() {
        // Havuzdan rastgele 3 farklı cümle seç
        const shuffled = [...presetSentences].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);
        
        questions = selected.map(item => ({
            sentence: `${item.p} ${item.g === 'm' ? item.v_m : item.v_f} ${item.l} ${item.t}`,
            p: item.p,
            l: item.l,
            t: item.t
        }));
        showQuestion();
    }

    function showQuestion() {
        const box = document.getElementById('targetSentence');
        box.innerText = questions[currentQuestion].sentence;
        resetUI();
    }

    function resetUI() {
        document.querySelectorAll('.picker-column').forEach(c => c.classList.remove('correct', 'wrong'));
        document.getElementById('checkBtn').classList.remove('hidden');
        document.getElementById('nextBtn').classList.add('hidden');
    }

    function checkAnswer() {
        const q = questions[currentQuestion];
        const selP = document.querySelector('#person-picker .picker-item.active')?.getAttribute('data-val');
        const selL = document.querySelector('#place-picker .picker-item.active')?.getAttribute('data-val');
        const selT = document.querySelector('#transport-picker .picker-item.active')?.getAttribute('data-val');

        const isP = selP === q.p;
        const isL = selL === q.l;
        const isT = selT === q.t;

        document.getElementById('person-picker').classList.add(isP ? 'correct' : 'wrong');
        document.getElementById('place-picker').classList.add(isL ? 'correct' : 'wrong');
        document.getElementById('transport-picker').classList.add(isT ? 'correct' : 'wrong');

        const step = document.querySelectorAll('.progress-step')[currentQuestion];
        if (isP && isL && isT) {
            document.getElementById('soundCorrect').play().catch(() => {});
            step.style.background = 'var(--success)';
            document.getElementById('checkBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        } else {
            document.getElementById('soundWrong').play().catch(() => {});
            step.style.background = 'var(--error)';
        }
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < 3) {
            showQuestion();
            spinPickers();
        } else {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('nextStudentScreen').classList.remove('hidden');
        }
    }

    function resetGame() {
        currentQuestion = 0;
        document.querySelectorAll('.progress-step').forEach(s => s.style.background = '#ddd');
        document.getElementById('nextStudentScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        generateRound();
        spinPickers();
    }

    initPickers();
    generateRound();
    spinPickers();
</script>
</body>
</html>
