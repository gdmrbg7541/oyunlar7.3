<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إِلى أَيْن نُسافِرُ؟ - أَلْعاب</title>
    <style>
        @font-face { 
            font-family: 'Arakom'; 
            src: url('arakom.ttf') format('truetype'); 
        }
        
        :root {
            --primary: #1e3a8a; 
            --secondary: #0ea5e9; 
            --accent: #f59e0b; 
            --text-main: #1e293b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arakom', 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f9ff;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(224, 242, 254, 0.9) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(186, 230, 253, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(254, 243, 199, 0.6) 0%, transparent 50%), 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 3vh 3vw;
            overflow-x: hidden; 
            position: relative;
        }

        /* --- ARKA PLAN SAYDAM EMOJİLER (KENARLARA İTİLDİ VE DAHA GÖRÜNÜR YAPILDI) --- */
        .floating-emojis {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            pointer-events: none; 
            z-index: -2;
            overflow: hidden;
        }

        .floating-emojis span {
            position: absolute;
            opacity: 0.25; /* Görünürlük artırıldı */
            /* filter: grayscale(); Tamamen kaldırıldı, artık tam renkli */
            animation: float ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(-25px) rotate(12deg) scale(1.05); }
        }

        /* Merkez (Kartların olduğu alan) boş bırakılarak emojiler kenarlara dağıtıldı */
        .em-1 { top: 4%; left: 3%; font-size: clamp(3rem, 6vw, 5rem); animation-duration: 12s; animation-delay: 0s; } /* Uçak */
        .em-2 { top: 6%; right: 4%; font-size: clamp(3.5rem, 7vw, 6rem); animation-duration: 15s; animation-delay: -2s; } /* Aile */
        .em-3 { top: 35%; left: 2%; font-size: clamp(2.5rem, 5vw, 4.5rem); animation-duration: 14s; animation-delay: -5s; } /* Tren */
        .em-4 { top: 40%; right: 2%; font-size: clamp(4rem, 8vw, 6.5rem); animation-duration: 18s; animation-delay: -3s; } /* Cami/Mekan */
        .em-5 { top: 75%; left: 4%; font-size: clamp(3.5rem, 7vw, 5.5rem); animation-duration: 13s; animation-delay: -7s; } /* Plaj */
        .em-6 { top: 72%; right: 5%; font-size: clamp(3rem, 6vw, 4.5rem); animation-duration: 16s; animation-delay: -1s; } /* Gemi */
        .em-7 { top: 18%; left: 12%; font-size: clamp(2rem, 4vw, 3.5rem); animation-duration: 11s; animation-delay: -4s; } /* Kamera */
        .em-8 { top: 22%; right: 10%; font-size: clamp(2.5rem, 5vw, 4rem); animation-duration: 17s; animation-delay: -6s; } /* Valiz */
        .em-9 { top: 88%; left: 15%; font-size: clamp(2rem, 4vw, 3.5rem); animation-duration: 14s; animation-delay: -2s; } /* Harita */
        .em-10 { top: 85%; right: 18%; font-size: clamp(3rem, 6vw, 5rem); animation-duration: 19s; animation-delay: -8s; } /* Araba */
        .em-11 { top: 3%; left: 25%; font-size: clamp(3.5rem, 7vw, 5.5rem); animation-duration: 15s; animation-delay: -3s; } /* Dağ/Kamp */
        .em-12 { top: 4%; right: 28%; font-size: clamp(2.5rem, 5vw, 4.5rem); animation-duration: 12s; animation-delay: -9s; } /* Dede/Nine */
        .em-13 { top: 55%; left: 8%; font-size: clamp(2.5rem, 5vw, 4rem); animation-duration: 16s; animation-delay: -5s; } /* Sırt Çantası */

        .main-container {
            width: 100%;
            max-width: 850px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(25px, 5vh, 45px); 
            z-index: 10;
        }

        .header { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.85); /* Emojiler belirginleştiği için arka plan biraz daha matlaştırıldı */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: clamp(20px, 4vw, 35px) clamp(25px, 6vw, 60px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.05);
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        .unit-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary), #0284c7);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            letter-spacing: 0.5px;
        }

        .header h1 { 
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            color: var(--primary); 
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header p { 
            color: var(--text-main); 
            font-size: clamp(1.1rem, 3vw, 1.6rem); 
            opacity: 0.8;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: stretch;
            width: 100%;
            gap: clamp(15px, 2.5vw, 30px);
        }

        .game-card {
            position: relative;
            overflow: hidden; 
            background: rgba(255, 255, 255, 0.85); /* Kartlar da okunabilirlik için matlaştırıldı */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 1);
            border-radius: 30px; 
            padding: clamp(15px, 3vw, 25px); 
            text-align: center;
            text-decoration: none; 
            color: var(--primary); 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.04);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            flex: 1 1 calc(45% - 30px);
            max-width: 380px;
            min-width: clamp(150px, 40%, 260px);
            min-height: clamp(160px, 22vh, 200px);
            z-index: 1;
        }

        .game-card::before {
            content: attr(data-num);
            position: absolute;
            bottom: -5%;
            left: 3%; 
            font-size: clamp(6rem, 15vw, 11rem); 
            font-family: 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            font-weight: 900;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.08), rgba(30, 58, 138, 0.01));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1; 
            line-height: 0.8;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 15px 40px rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.4);
        }

        .game-card:hover::before {
            transform: translateY(-15px) scale(1.05) rotate(-5deg);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0.05));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .icon-circle {
            width: clamp(65px, 12vw, 90px); 
            height: clamp(65px, 12vw, 90px); 
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240, 249, 255, 0.6));
            border: 2px solid rgba(255,255,255,1);
            border-radius: 24px; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            margin-bottom: 15px; 
            font-size: clamp(2.4rem, 6vw, 3.5rem);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.08);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-card:hover .icon-circle {
            transform: scale(1.15) rotate(8deg);
            background: rgba(255, 255, 255, 1);
            border-color: var(--secondary);
        }

        .game-card h2 { 
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: bold;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .game-card { 
                flex-basis: calc(50% - 15px);
                border-radius: 25px;
            }
            .game-card::before {
                font-size: clamp(5.5rem, 18vw, 9rem); 
                bottom: -8%;
            }
        }

        @media (max-width: 400px) {
            .game-card {
                flex-basis: 100%;
                max-width: 100%;
                min-height: 100px;
                flex-direction: row; 
                gap: 15px;
                padding: 15px 20px;
                justify-content: flex-start;
                text-align: right;
            }
            .icon-circle {
                margin-bottom: 0;
                flex-shrink: 0;
                width: 55px;
                height: 55px;
                font-size: 1.8rem;
                border-radius: 18px;
            }
            .game-card h2 {
                margin-top: 0;
                font-size: 1.25rem;
            }
            .game-card::before {
                left: 5%;
                bottom: -20%;
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Saydam Emojiler -->
    <div class="floating-emojis">
        <span class="em-1">✈️</span>
        <span class="em-2">👨‍👩‍👧‍👦</span>
        <span class="em-3">🚆</span>
        <span class="em-4">🕌</span>
        <span class="em-5">🏖️</span>
        <span class="em-6">🛳️</span>
        <span class="em-7">📷</span>
        <span class="em-8">🧳</span>
        <span class="em-9">🗺️</span>
        <span class="em-10">🚗</span>
        <span class="em-11">🏕️</span>
        <span class="em-12">🧓</span>
        <span class="em-13">🎒</span>
    </div>

    <div class="main-container">
        <div class="header">
            <span class="unit-badge">الوَحْدَة الثّالِثَة</span>
            <h1>إِلى أَيْن نُسافِرُ؟</h1>
            <p>أَلْعاب اللُّغَة العَرَبِيَّة لِمَوْضوعِ السَّفَر</p>
        </div>

        <div class="grid-container">
            <a href="kelime.html" class="game-card" data-num="1">
                <div class="icon-circle">🎯</div>
                <h2>صَيْد الرُّموز</h2>
            </a>

            <a href="seyahat.html" class="game-card" data-num="2">
                <div class="icon-circle">✈️</div>
                <h2>السَّفَر</h2>
            </a>

            <a href="sestesti.html" class="game-card" data-num="3">
                <div class="icon-circle">⏳</div>
                <h2>قريباً (yakında)</h2>
            </a>

            <a href="hafizakarti.html" class="game-card" data-num="4">
                <div class="icon-circle">🧠</div>
                <h2>لُعْبَة الذّاكِرَة</h2>
            </a>
        </div>
    </div>

</body>
</html>
